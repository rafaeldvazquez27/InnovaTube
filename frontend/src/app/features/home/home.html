<div class="container mt-4">

    <h2>Buscar Videos</h2>

    <div class="input-group mb-4">

        <input type="text" class="form-control" placeholder="Buscar..." [(ngModel)]="searchText">

        <button class="btn btn-primary" (click)="searchVideos()">

            Buscar

        </button>

    </div>

    <div class="row">

        @for(video of videos; track video.id.videoId){

        <div class="col-md-4 mb-4">

            <div class="card h-100">

                <img class="card-img-top" [src]="video.snippet.thumbnails.medium.url">

                <div class="card-body">

                    <h6>

                        {{ video.snippet.title }}

                    </h6>

                    <p>

                        {{ video.snippet.channelTitle }}

                    </p>

                    <button class="btn btn-outline-danger w-100" (click)="addFavorite(video)">

                        ❤️ Favorito

                    </button>

                </div>

            </div>

        </div>

        }

    </div>

</div>
